<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LED Matrix Display Controller</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <header>
        <h1>🎨 LED Matrix Display Controller</h1>
        <div id="connection-status" class="status disconnected">⚫ Disconnected</div>
    </header>

    <main>
        <!-- Connection Panel -->
        <section class="panel">
            <h2>Connection</h2>
            <div class="control-group">
                <select id="port-select">
                    <option value="">-- Select Port --</option>
                </select>
                <button id="refresh-ports" class="btn-icon" title="Refresh ports">🔄</button>
            </div>
            <div class="control-group">
                <button id="connect-btn" class="btn-primary btn-block">Connect</button>
                <button id="disconnect-btn" class="btn-danger btn-block" disabled>Disconnect</button>
            </div>
        </section>

        <!-- Image/Video Display -->
        <section class="panel">
            <h2>Media Display</h2>

            <div class="settings-group">
                <label for="color-mode">Color Mode:</label>
                <select id="color-mode">
                    <option value="rgb565">RGB565 (Standard)</option>
                    <option value="rgb565-dithered">RGB565 Dithered</option>
                    <option value="gameboy">Game Boy (4 shades)</option>
                    <option value="grayscale">Grayscale</option>
                    <option value="sepia">Sepia Tone</option>
                    <option value="highcontrast">High Contrast</option>
                </select>
            </div>

            <div class="image-controls">
                <button id="load-image-btn" class="btn-primary btn-block" disabled>
                    📂 Load Media (Image/Video/GIF)
                </button>

                <canvas id="preview-canvas" width="192" height="32"></canvas>

                <p class="image-info" id="image-info">No media loaded</p>

                <!-- Playback Controls -->
                <div id="playback-controls" style="display: none;">
                    <div class="settings-group">
                        <label for="fps-slider">Frame Rate: <span id="fps-value">12</span> FPS</label>
                        <input type="range" id="fps-slider" min="5" max="20" value="12" step="1">
                    </div>

                    <div class="control-group">
                        <button id="play-btn" class="btn-success">▶ Play</button>
                        <button id="pause-btn" class="btn-warning" disabled>⏸ Pause</button>
                        <button id="stop-btn" class="btn-danger" disabled>⏹ Stop</button>
                    </div>
                </div>
            </div>
        </section>

        <!-- Test Patterns (Moved Down) -->
        <section class="panel">
            <h2>Test Patterns</h2>
            <div class="pattern-grid">
                <button class="pattern-btn" data-pattern="0" disabled>
                    <span class="icon">⚫</span>
                    <span class="label">Blackout</span>
                </button>
                <button class="pattern-btn" data-pattern="1" disabled>
                    <span class="icon">🌈</span>
                    <span class="label">Rainbow</span>
                </button>
                <button class="pattern-btn" data-pattern="2" disabled>
                    <span class="icon">📊</span>
                    <span class="label">Moving Bars</span>
                </button>
                <button class="pattern-btn" data-pattern="3" disabled>
                    <span class="icon">🎨</span>
                    <span class="label">Solid Colors</span>
                </button>
            </div>
            <button id="clear-btn" class="btn-danger btn-block" disabled>
                🗑️ Clear Display
            </button>
        </section>

        <!-- Serial Commands Panel (Moved Down) -->
        <section class="panel">
            <h2>Debug Commands</h2>
            <div class="command-grid">
                <button class="cmd-btn" data-command="0" disabled title="Command: 0">
                    <span class="cmd-label">Blackout</span>
                    <span class="cmd-code">0</span>
                </button>
                <button class="cmd-btn" data-command="1" disabled title="Command: 1">
                    <span class="cmd-label">Rainbow</span>
                    <span class="cmd-code">1</span>
                </button>
                <button class="cmd-btn" data-command="2" disabled title="Command: 2">
                    <span class="cmd-label">Moving Bars</span>
                    <span class="cmd-code">2</span>
                </button>
                <button class="cmd-btn" data-command="3" disabled title="Command: 3">
                    <span class="cmd-label">Solid Colors</span>
                    <span class="cmd-code">3</span>
                </button>
                <button class="cmd-btn" data-command="C" disabled title="Command: C">
                    <span class="cmd-label">Clear Display</span>
                    <span class="cmd-code">C</span>
                </button>
                <button class="cmd-btn" data-command="I" disabled title="Command: I">
                    <span class="cmd-label">Image Mode</span>
                    <span class="cmd-code">I</span>
                </button>
                <button class="cmd-btn" data-command="V" disabled title="Command: V">
                    <span class="cmd-label">Video Mode</span>
                    <span class="cmd-code">V</span>
                </button>
                <button class="cmd-btn" data-command="S" disabled title="Command: S">
                    <span class="cmd-label">Stop Video</span>
                    <span class="cmd-code">S</span>
                </button>
                <button class="cmd-btn" data-command="P" disabled title="Command: P">
                    <span class="cmd-label">Ping</span>
                    <span class="cmd-code">P</span>
                </button>
            </div>

            <!-- Custom Command -->
            <div class="custom-command">
                <input type="text" id="custom-cmd-input" placeholder="Custom command" maxlength="1" disabled>
                <button id="send-custom-cmd" class="btn-primary" disabled>Send</button>
            </div>
        </section>

        <!-- Serial Monitor -->
        <section class="panel">
            <div class="panel-header">
                <h2>Serial Monitor</h2>
                <button id="clear-console" class="btn-icon" title="Clear console">🗑️</button>
            </div>
            <div id="serial-console" class="serial-console"></div>
            <div class="console-stats">
                <span id="console-lines">Lines: 0</span>
                <label class="checkbox-label">
                    <input type="checkbox" id="auto-scroll" checked>
                    Auto-scroll
                </label>
            </div>
        </section>

        <div id="status-message" class="status-message">Ready</div>
    </main>
</div>

<script src="app.js"></script>
</body>
</html>
