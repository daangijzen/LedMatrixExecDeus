<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LED Matrix Video Player</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <header>
        <h1>🎬 LED Matrix Video Player</h1>
        <div id="connection-status" class="status disconnected">⚫ Disconnected</div>
    </header>

    <main>
        <!-- Connection -->
        <section class="panel">
            <h2>Connection</h2>
            <div class="control-group">
                <select id="port-select">
                    <option value="">-- Select Port --</option>
                </select>
                <button id="refresh-ports" class="btn-icon">🔄</button>
            </div>
            <div class="control-group">
                <button id="connect-btn" class="btn-primary btn-block">Connect</button>
                <button id="disconnect-btn" class="btn-danger btn-block" disabled>Disconnect</button>
            </div>
        </section>

        <!-- Video Player -->
        <section class="panel">
            <h2>Video Playback</h2>
            <canvas id="preview-canvas" width="192" height="32"></canvas>
            <p id="video-info">No video loaded</p>

            <button id="load-video-btn" class="btn-primary btn-block" disabled>📂 Load Video</button>

            <div id="playback-controls" style="display: none;">
                <div class="control-group">
                    <button id="play-btn" class="btn-success">▶ Play</button>
                    <button id="stop-btn" class="btn-danger" disabled>⏹ Stop</button>
                </div>
            </div>
        </section>

        <!-- Quick Actions -->
        <section class="panel">
            <h2>Quick Actions</h2>
            <button id="test-pattern-btn" class="btn-primary btn-block" disabled>🌈 Test Pattern</button>
            <button id="clear-btn" class="btn-danger btn-block" disabled>🗑️ Clear Display</button>
        </section>

        <div id="status-message" class="status-message">Ready</div>
    </main>
</div>

<script src="app.js"></script>
</body>
</html>
